<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" font-family="sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="450" rx="16" fill="#fffaf3" fill-opacity="0.93"/>
  <style>
    .t{font-size:34px;font-weight:bold;fill:#222;text-anchor:middle}
    .s{font-size:25px;fill:#333;text-anchor:middle}
    .b{font-size:23px;fill:#fff;text-anchor:middle;font-weight:bold}
    .k{font-size:23px;fill:#222;text-anchor:middle;font-style:italic}
  </style>

  <!-- Left: Rust for Linux -->
  <text x="200" y="48" class="t">Rust for Linux</text>
  <rect x="60" y="70" width="280" height="190" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <rect x="80" y="90" width="115" height="70" rx="6" fill="#9ca3af"/><text x="137" y="132" class="b">C</text>
  <rect x="205" y="90" width="115" height="70" rx="6" fill="#9ca3af"/><text x="262" y="132" class="b">C</text>
  <rect x="80" y="170" width="115" height="70" rx="6" fill="#9ca3af"/><text x="137" y="212" class="b">C</text>
  <rect x="205" y="170" width="115" height="70" rx="6" fill="#b7410e"/><text x="262" y="212" class="b">Rust</text>
  <text x="200" y="300" class="k">existing Linux kernel</text>
  <text x="200" y="335" class="s">Replace parts with Rust,</text>
  <text x="200" y="362" class="s">little by little</text>

  <!-- Middle: Asterinas + Verus -->
  <text x="600" y="48" class="t">Asterinas + Verus</text>
  <rect x="460" y="70" width="280" height="190" rx="10" fill="#fde2d0" stroke="#b7410e" stroke-width="2"/>
  <rect x="480" y="90" width="240" height="90" rx="6" fill="#b7410e"/><text x="600" y="142" class="b">Rust (from scratch)</text>
  <rect x="480" y="190" width="240" height="50" rx="6" fill="#1d4ed8"/><text x="600" y="222" class="b">verified by Verus</text>
  <text x="600" y="300" class="k">Linux-compatible kernel</text>
  <text x="600" y="335" class="s">Designed from scratch in Rust,</text>
  <text x="600" y="362" class="s">partly verified with Verus</text>

  <!-- Right: Takibi -->
  <text x="1000" y="48" class="t">Takibi</text>
  <rect x="860" y="70" width="280" height="190" rx="10" fill="#fff1c2" stroke="#ea580c" stroke-width="3"/>
  <rect x="880" y="90" width="240" height="50" rx="6" fill="#ea580c"/><text x="1000" y="122" class="b">new language: Takibi</text>
  <rect x="880" y="150" width="240" height="90" rx="6" fill="#f59e0b"/><text x="1000" y="190" class="b">kernel written</text><text x="1000" y="215" class="b">in Takibi</text>
  <text x="1000" y="300" class="k">Linux-compatible kernel</text>
  <text x="1000" y="335" class="s">Design an embedded language,</text>
  <text x="1000" y="362" class="s">then write the kernel in it</text>

  <!-- spectrum -->
  <line x1="80" y1="405" x2="1120" y2="405" stroke="#c2410c" stroke-width="4" marker-end="url(#ah)"/>
  <text x="80" y="438" font-size="22" fill="#444">incremental</text>
  <text x="1110" y="438" font-size="22" fill="#444" text-anchor="end">most radical</text>
</svg>
